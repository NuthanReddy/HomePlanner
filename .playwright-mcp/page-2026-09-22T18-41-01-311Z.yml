          - generic [ref=f2e456]: "Land is charged on the gross plot — you pay for the full registered extent including any strip later surrendered for road widening, which is why a sub-9 m road hurts the index twice. Stamp duty and LRS are levied on the SRO value, not your purchase price. Confidence. The impact-fee table is read directly from GO 168 Rule 21 Table VI, and the LRS slabs from GO 135 — both reliable, though GO 168 says rates \"may be revised from time to time\" and no later revision was locatable. Betterment charges are from the 2008 GHMC schedule and are the weakest number here — treat as a floor. TG-bPASS and BRS are distinct: TG-bPASS building permission is the normal pre-construction route; this BRS input is a manual legacy GO 152/2015 post-facto regularisation estimate. Confirm the current application route and eligibility with TG-bPASS / HMDA. Building permit and scrutiny fees are computed internally by TG-bPASS and are not included. Not tax advice — confirm GST and cess with your CA."
