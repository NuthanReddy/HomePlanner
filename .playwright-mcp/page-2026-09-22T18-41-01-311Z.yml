  - generic [ref=f2e457]: Sources. G.O.Ms.No.168 MA&UD dt. 07.04.2012 — Rule 2(f) definitions, Rule 4 & Table II (approach road), Rule 5 & Table III (setbacks & height), Rule 6 (projections), Rule 7 & Table IV (high-rise), Rule 13 & Table V (parking), Rule 26 (occupancy certificate & compounding), Rule 27 (enforcement). G.O.Ms.No.95 MA&UD dt. 21.03.2026 — Rule 2(f) substituted, Rule 17(d)(viii)–(xii) inserted, Rule 17(f)(xii) substituted. TG-bPASS Act 12 of 2020 s.7 (permission tiers); Telangana Municipalities Act 2019 s.174 (enforcement). Caveat. Master-plan land use, Annexure I/II restrictions, Banjara & Jubilee Hills special rules, heritage and religious-structure buffers, FTL/buffer zones, HMDA layout conditions, airport funnel zones and local road-widening proposals can all override these figures. GO 95 takes effect on publication in the Telangana Gazette. Other amendment GOs since 2014 are published as scanned images and were not machine-readable, so Table II/III/IV cell values here are the 2012 originals. Confirm on TG-bPASS before you design or buy.