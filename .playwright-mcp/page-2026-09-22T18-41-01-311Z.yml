          - generic [ref=f2e144]: 9 m (30 ft) road → 5 floors maximum. Table II category B1 permits "cellar and/or stilt as permissible + maximum up to 5 floors". Table III caps height at 15 m, and the 15–18 m band needs a minimum 12 m road. GO 95 did not change this — its extra-floor benefit needs a 40 ft road and a plot above 2 000 sq m. A 6th habitable floor needs a 12 m (40 ft) road.
          - generic [ref=f2e145]: Corner plot — SE. Roads on the South and East edges. Rule 5(f)(ii) puts the front setback on the wider road (East, 9.1 m); the Column-10 setback applies on every remaining edge. A junction splay of 3 × 3 m is required and counts as part of the road junction (Rule 5(f)(xiv)). For an individual residential building you may elect the front on the other road instead — but then you get no access from the first.
